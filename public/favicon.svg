<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background & Glowing Radial Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1c1f2e"/>
      <stop offset="100%" stop-color="#08090c"/>
    </radialGradient>
    
    <!-- 24K Luxury Gold Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>

    <!-- Cyan/Aqua Vitality Glow for Pulse Line -->
    <linearGradient id="vitalityGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Drop Shadow Filter for 3D App Icon Depth -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#ffd700" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Container (Apple / Modern Android standard 512x512) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGlow)"/>
  
  <!-- Subtle Outer Gold Accent Border -->
  <rect width="506" height="506" x="3" y="3" rx="113" fill="none" stroke="url(#goldMetallic)" stroke-width="3" stroke-opacity="0.35"/>
  
  <!-- Inner Ambient Geometric Grid -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255, 215, 0, 0.08)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255, 215, 0, 0.05)" stroke-width="1.5"/>

  <!-- Main APEX Transformation Crest / Ascending Mountain Summit -->
  <g filter="url(#iconShadow)">
    <!-- Primary Ascending Apex Triangle / Peak -->
    <path d="M 256 96 
             L 378 338 
             L 326 338 
             L 256 198 
             L 186 338 
             L 134 338 
             Z" 
          fill="url(#goldMetallic)"/>

    <!-- Inner Floating Power Diamond / Target Core -->
    <polygon points="256,236 284,296 256,356 228,296" fill="url(#goldMetallic)" opacity="0.95"/>
    
    <!-- Dynamic Vitality Pulse Heartbeat Line Across Lower Peak -->
    <path d="M 120 380 
             L 195 380 
             L 215 348 
             L 240 412 
             L 272 328 
             L 297 380 
             L 392 380" 
          fill="none" 
          stroke="url(#vitalityGlow)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>